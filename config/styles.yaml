# Fuente única de verdad para todos los estilos del proyecto Caracas Transit.
# Este archivo define colores, iconos, anchos y escalas para cada sistema.
# Los scripts/generate-styles.js inyectan estos estilos en cada archivo KML.
# Ver docs/STYLE_GUIDE.md para la documentación completa.

